name: Discover publications
on:
  schedule:
    - cron: '23 10 3 * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: publication-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check for an update awaiting review
        id: pending
        run: |
          count=$(gh pr list --state open --limit 100 --json headRefName --jq '[.[] | select(.headRefName | startswith("automation/publications-"))] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Test publication discovery
        if: steps.pending.outputs.count == '0'
        run: python3 -m unittest discover -s tests -v
      - name: Discover additions
        if: steps.pending.outputs.count == '0'
        run: python3 scripts/sync_publications.py --report /tmp/publication-review.md
      - name: Check for changes
        id: changed
        if: steps.pending.outputs.count == '0'
        run: |
          if git diff --quiet -- _data/publications.json; then
            echo 'value=false' >> "$GITHUB_OUTPUT"
          else
            echo 'value=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: ruby/setup-ruby@v1
        if: steps.changed.outputs.value == 'true'
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Validate the candidate site
        if: steps.changed.outputs.value == 'true'
        run: |
          bundle exec jekyll build --trace
          python3 scripts/check_links.py _site
      - name: Open publication review pull request
        if: steps.changed.outputs.value == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="automation/publications-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add _data/publications.json
          git commit -m 'Discover new CORE Lab publications'
          git push origin "$branch"
          gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title 'Review new CORE Lab publications' --body-file /tmp/publication-review.md
